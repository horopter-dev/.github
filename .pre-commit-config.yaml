# Without this, `prek install` wires only the pre-commit stage and commit messages go unlinted.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: https://github.com/jdx/jactionlint
    rev: baa8d685e2b27ff5821558c9eeabb2051c1da61b  # frozen: v2.4.0
    hooks:
      - id: jactionlint

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.39.0
    hooks:
      - id: check-dependabot
      - id: check-github-workflows
      - id: check-github-issue-config
      - id: check-github-issue-forms

name: Bug report
description: Something in Horopter does not work as documented.
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of Horopter is affected?
      options:
        - ingress
        - egress
        - horopter-migrate
        - horoctl
        - horo
        - horopter-flux
        - Helm charts
        - record-action
        - Docs site
        - Other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of the affected binary's `--version`, or the chart or action version.
      placeholder: v0.x.y
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, and what Horopter did.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of commands or requests that shows the problem.
      placeholder: |
        1.
        2.
        3.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines. Remove keys, secrets and personal data first.
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >-
        How Horopter runs (compose, Kubernetes, binaries), the PostgreSQL version, and the OS.
